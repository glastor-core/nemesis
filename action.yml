name: "Nemesis Universal Security, Hygiene & Compliance Auditor"
description: "Automated DevSecOps security, hygiene, license compliance, auto-clean commits & 1-click PR suggestions"
author: "Glastor Core / Nemesis Team"
branding:
  icon: "shield"
  color: "purple"

inputs:
  target-path:
    description: "Path of repository or directory to audit"
    required: false
    default: "."
  scan-secrets:
    description: "Enable Gitleaks secret scanning"
    required: false
    default: "true"
  scan-sast:
    description: "Enable Semgrep SAST scanning"
    required: false
    default: "true"
  scan-sca:
    description: "Enable Trivy SCA/dependency scanning"
    required: false
    default: "true"
  scan-hygiene:
    description: "Enable repository hygiene and junk file detection"
    required: false
    default: "true"
  scan-licenses:
    description: "Enable open source license compliance checks"
    required: false
    default: "true"
  generate-sbom:
    description: "Generate CycloneDX SBOM report"
    required: false
    default: "true"
  diff-mode:
    description: "Only scan files modified in current Pull Request/commit"
    required: false
    default: "false"
  diff-base-ref:
    description: "Base Git ref for differential scan"
    required: false
    default: "origin/main"
  auto-fix:
    description: "Automatically remove toxic files and commit/push cleanups"
    required: false
    default: "false"
  pr-suggestions:
    description: "Generate 1-click interactive GitHub PR Review Suggestions"
    required: false
    default: "true"
  max-file-size-mb:
    description: "Max allowed file size before warning in MB"
    required: false
    default: "10"
  require-license:
    description: "Require a LICENSE file in repository root"
    required: false
    default: "false"
  fail-on-critical:
    description: "Fail the step if CRITICAL vulnerabilities are found"
    required: false
    default: "false"
  fail-on-high:
    description: "Fail the step if HIGH or CRITICAL vulnerabilities are found"
    required: false
    default: "false"
  fail-on-medium:
    description: "Fail the step if MEDIUM or higher vulnerabilities are found"
    required: false
    default: "false"
  post-pr-comment:
    description: "Post a Markdown summary comment on the Pull Request"
    required: false
    default: "true"
  create-annotations:
    description: "Annotate code lines directly on GitHub Pull Request diff"
    required: false
    default: "true"
  upload-sarif:
    description: "Upload SARIF results to GitHub Security tab"
    required: false
    default: "true"
  output-dir:
    description: "Directory where audit reports are saved"
    required: false
    default: ".nemesis-reports"
  config-file:
    description: "Path to .nemesis.yml configuration / suppression file"
    required: false
    default: ""
  slack-webhook-url:
    description: "Slack Webhook URL for audit notifications"
    required: false
    default: ""
  discord-webhook-url:
    description: "Discord Webhook URL for audit notifications"
    required: false
    default: ""
  github-token:
    description: "GitHub token for PR commenting and API access"
    required: false
    default: ${{ github.token }}
  semgrep-rules:
    description: "Semgrep rule pack or config path"
    required: false
    default: "p/security-audit"
  trivy-severity:
    description: "Trivy severities to capture"
    required: false
    default: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"

outputs:
  passed:
    description: "Whether the audit passed threshold criteria (true/false)"
    value: ${{ steps.run-nemesis.outputs.passed }}
  total-findings:
    description: "Total number of findings discovered"
    value: ${{ steps.run-nemesis.outputs.total-findings }}
  critical-count:
    description: "Number of critical findings"
    value: ${{ steps.run-nemesis.outputs.critical-count }}
  high-count:
    description: "Number of high findings"
    value: ${{ steps.run-nemesis.outputs.high-count }}
  ignored-count:
    description: "Number of findings suppressed via .nemesis.yml"
    value: ${{ steps.run-nemesis.outputs.ignored-count }}
  auto-fixed-count:
    description: "Number of issues resolved automatically"
    value: ${{ steps.run-nemesis.outputs.auto-fixed-count }}
  report-json:
    description: "Path to generated JSON report"
    value: ${{ steps.run-nemesis.outputs.report-json }}
  report-md:
    description: "Path to generated Markdown report"
    value: ${{ steps.run-nemesis.outputs.report-md }}
  report-sarif:
    description: "Path to generated SARIF report"
    value: ${{ steps.run-nemesis.outputs.report-sarif }}
  sbom-file:
    description: "Path to generated CycloneDX SBOM"
    value: ${{ steps.run-nemesis.outputs.sbom-file }}

runs:
  using: "composite"
  steps:
    - name: Setup Deno Runtime
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Cache Trivy Vulnerability Database
      uses: actions/cache@v6
      with:
        path: ~/.cache/trivy
        key: trivy-db-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          trivy-db-${{ runner.os }}-

    - name: Ensure Audit Tools on Linux Runner
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # Install Gitleaks if missing
        if ! command -v gitleaks &> /dev/null && [ "${{ inputs.scan-secrets }}" = "true" ]; then
          echo "[Nemesis] Installing Gitleaks..."
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          rm -f /tmp/gitleaks.tar.gz
        fi

        # Install Semgrep if missing
        if ! command -v semgrep &> /dev/null && [ "${{ inputs.scan-sast }}" = "true" ]; then
          echo "[Nemesis] Installing Semgrep..."
          python3 -m pip install --break-system-packages --upgrade semgrep 2>/dev/null || python3 -m pip install --upgrade semgrep 2>/dev/null || true
        fi

        # Install Trivy if missing
        if ! command -v trivy &> /dev/null && ([ "${{ inputs.scan-sca }}" = "true" ] || [ "${{ inputs.scan-licenses }}" = "true" ] || [ "${{ inputs.generate-sbom }}" = "true" ]); then
          echo "[Nemesis] Installing Trivy..."
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v0.76.0
        fi

    - name: Run Nemesis Auditor
      id: run-nemesis
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_TARGET_PATH: ${{ inputs.target-path }}
        INPUT_SCAN_SECRETS: ${{ inputs.scan-secrets }}
        INPUT_SCAN_SAST: ${{ inputs.scan-sast }}
        INPUT_SCAN_SCA: ${{ inputs.scan-sca }}
        INPUT_SCAN_HYGIENE: ${{ inputs.scan-hygiene }}
        INPUT_SCAN_LICENSES: ${{ inputs.scan-licenses }}
        INPUT_GENERATE_SBOM: ${{ inputs.generate-sbom }}
        INPUT_DIFF_MODE: ${{ inputs.diff-mode }}
        INPUT_DIFF_BASE_REF: ${{ inputs.diff-base-ref }}
        INPUT_AUTO_FIX: ${{ inputs.auto-fix }}
        INPUT_PR_SUGGESTIONS: ${{ inputs.pr-suggestions }}
        INPUT_MAX_FILE_SIZE_MB: ${{ inputs.max-file-size-mb }}
        INPUT_REQUIRE_LICENSE: ${{ inputs.require-license }}
        INPUT_FAIL_ON_CRITICAL: ${{ inputs.fail-on-critical }}
        INPUT_FAIL_ON_HIGH: ${{ inputs.fail-on-high }}
        INPUT_FAIL_ON_MEDIUM: ${{ inputs.fail-on-medium }}
        INPUT_POST_PR_COMMENT: ${{ inputs.post-pr-comment }}
        INPUT_CREATE_ANNOTATIONS: ${{ inputs.create-annotations }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_SLACK_WEBHOOK_URL: ${{ inputs.slack-webhook-url }}
        INPUT_DISCORD_WEBHOOK_URL: ${{ inputs.discord-webhook-url }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_SEMGREP_RULES: ${{ inputs.semgrep-rules }}
        INPUT_TRIVY_SEVERITY: ${{ inputs.trivy-severity }}
      run: |
        deno run --allow-all --config "${{ github.action_path }}/deno.json" "${{ github.action_path }}/src/main.ts"

    - name: Upload SARIF to GitHub Security Tab
      if: ${{ inputs.upload-sarif == 'true' && hashFiles(format('{0}/nemesis-report.sarif', inputs.output-dir)) != '' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.output-dir }}/nemesis-report.sarif
        category: "nemesis-security-audit"
      continue-on-error: true
