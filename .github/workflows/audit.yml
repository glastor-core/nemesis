name: Nemesis Universal Security, Hygiene & Compliance Audit

on:
  workflow_call:
    inputs:
      target-path:
        description: "Directory to audit"
        required: false
        default: "."
        type: string
      fail-on-critical:
        description: "Fail pipeline on CRITICAL vulnerabilities"
        required: false
        default: false
        type: boolean
      fail-on-high:
        description: "Fail pipeline on HIGH or CRITICAL vulnerabilities"
        required: false
        default: false
        type: boolean
      scan-secrets:
        description: "Run secret scanning (Gitleaks)"
        required: false
        default: true
        type: boolean
      scan-sast:
        description: "Run SAST code scanning (Semgrep)"
        required: false
        default: true
        type: boolean
      scan-sca:
        description: "Run SCA dependency scanning (Trivy)"
        required: false
        default: true
        type: boolean
      scan-hygiene:
        description: "Run repository hygiene and junk cleanup checks"
        required: false
        default: true
        type: boolean
      scan-licenses:
        description: "Run license compliance scanning"
        required: false
        default: true
        type: boolean
      generate-sbom:
        description: "Generate CycloneDX SBOM report"
        required: false
        default: true
        type: boolean
      diff-mode:
        description: "Only scan files modified in current PR"
        required: false
        default: false
        type: boolean
      auto-fix:
        description: "Automatically remove toxic files and commit cleanups"
        required: false
        default: false
        type: boolean
      pr-suggestions:
        description: "Generate 1-click interactive GitHub PR Review Suggestions"
        required: false
        default: true
        type: boolean
      max-file-size-mb:
        description: "Max allowed file size in MB"
        required: false
        default: "10"
        type: string
      post-pr-comment:
        description: "Post PR comment with summary"
        required: false
        default: true
        type: boolean
      slack-webhook-url:
        description: "Slack Webhook URL for notifications"
        required: false
        default: ""
        type: string
      discord-webhook-url:
        description: "Discord Webhook URL for notifications"
        required: false
        default: ""
        type: string
    secrets:
      token:
        description: "GitHub token for PR commenting and SARIF upload"
        required: false

permissions:
  contents: write # Permite auto-commits de limpieza
  pull-requests: write # Permite PR comments y 1-click review suggestions
  security-events: write # Permite carga de alertas SARIF
  issues: write

jobs:
  security-audit:
    name: Security, Hygiene & Compliance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Nemesis Action
        uses: ./
        with:
          target-path: ${{ inputs.target-path }}
          fail-on-critical: ${{ inputs.fail-on-critical }}
          fail-on-high: ${{ inputs.fail-on-high }}
          scan-secrets: ${{ inputs.scan-secrets }}
          scan-sast: ${{ inputs.scan-sast }}
          scan-sca: ${{ inputs.scan-sca }}
          scan-hygiene: ${{ inputs.scan-hygiene }}
          scan-licenses: ${{ inputs.scan-licenses }}
          generate-sbom: ${{ inputs.generate-sbom }}
          diff-mode: ${{ inputs.diff-mode }}
          auto-fix: ${{ inputs.auto-fix }}
          pr-suggestions: ${{ inputs.pr-suggestions }}
          max-file-size-mb: ${{ inputs.max-file-size-mb }}
          post-pr-comment: ${{ inputs.post-pr-comment }}
          slack-webhook-url: ${{ inputs.slack-webhook-url }}
          discord-webhook-url: ${{ inputs.discord-webhook-url }}
          github-token: ${{ secrets.token || secrets.GITHUB_TOKEN }}
          upload-sarif: "true"
