name: Auto-Version on Push

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "!CHANGELOG.md"

permissions:
  contents: write

jobs:
  bump-version:
    name: Semantic Version Bump & Tag
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      has_bump: ${{ steps.semver.outputs.has_bump }}
      tag_name: ${{ steps.semver.outputs.tag_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Deno Runtime
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Calculate & Bump Semantic Version
        id: semver
        run: deno run --allow-all scripts/bump-version.ts

      - name: Commit and Push Version Bump & Tag
        if: steps.semver.outputs.has_bump == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add deno.json CITATION.cff CHANGELOG.md
          git commit -m "chore(release): bump version to ${{ steps.semver.outputs.tag_name }} [skip ci]"

          git tag -a "${{ steps.semver.outputs.tag_name }}" -m "Release ${{ steps.semver.outputs.tag_name }}"

          # Update floating major version tag (e.g. v1) for GitHub Actions Marketplace
          MAJOR_TAG=$(echo "${{ steps.semver.outputs.tag_name }}" | cut -d. -f1)
          git tag -fa "$MAJOR_TAG" -m "Release $MAJOR_TAG"

          git push origin HEAD:${{ github.ref_name }}
          git push origin "${{ steps.semver.outputs.tag_name }}"
          git push origin "$MAJOR_TAG" --force

  publish-release:
    name: Build & Publish Release
    needs: bump-version
    if: needs.bump-version.outputs.has_bump == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.bump-version.outputs.tag_name }}
    secrets: inherit
